[package]
name = "nevdex-arbitrage"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "NevDEX client and Uniswap V3 arbitrage example"
publish = false

[dependencies]
alloy = { version = "1", default-features = false, features = ["std", "sol-types", "signer-local", "consensus", "eips"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "arbitrage"
path = "src/main.rs"
